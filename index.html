<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Battle Zone - Stage 1</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #87ceeb;
        font-family: Arial, sans-serif;
    }

    #game {
        position: fixed;
        inset: 0;
    }

    canvas {
        display: block;
    }

    /* Crosshair */
    #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 28px;
        height: 28px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 10;
    }

    #crosshair::before,
    #crosshair::after {
        content: "";
        position: absolute;
        background: white;
        box-shadow: 0 0 3px black;
    }

    #crosshair::before {
        width: 2px;
        height: 28px;
        left: 13px;
        top: 0;
    }

    #crosshair::after {
        width: 28px;
        height: 2px;
        left: 0;
        top: 13px;
    }

    /* Top UI */
    #topUI {
        position: fixed;
        top: 15px;
        left: 15px;
        right: 15px;
        display: flex;
        justify-content: space-between;
        pointer-events: none;
        z-index: 20;
    }

    .panel {
        padding: 10px 14px;
        border-radius: 12px;
        color: white;
        background: rgba(0,0,0,.45);
        backdrop-filter: blur(5px);
        font-weight: bold;
    }

    /* Health */
    #healthBar {
        width: 150px;
        height: 10px;
        margin-top: 5px;
        border-radius: 10px;
        background: rgba(255,255,255,.3);
        overflow: hidden;
    }

    #health {
        width: 100%;
        height: 100%;
        background: #35d06f;
    }

    /* Joystick */
    #joystick {
        position: fixed;
        left: 25px;
        bottom: 35px;
        width: 125px;
        height: 125px;
        border-radius: 50%;
        background: rgba(255,255,255,.18);
        border: 2px solid rgba(255,255,255,.35);
        z-index: 30;
    }

    #stick {
        position: absolute;
        width: 58px;
        height: 58px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: rgba(255,255,255,.55);
        border: 2px solid white;
    }

    /* Action buttons */
    .action {
        position: fixed;
        border: 2px solid rgba(255,255,255,.7);
        color: white;
        background: rgba(0,0,0,.4);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        z-index: 30;
    }

    #jump {
        right: 35px;
        bottom: 145px;
        width: 68px;
        height: 68px;
    }

    #run {
        right: 115px;
        bottom: 55px;
        width: 58px;
        height: 58px;
    }

    #shoot {
        right: 30px;
        bottom: 45px;
        width: 88px;
        height: 88px;
        background: rgba(180,30,30,.5);
    }

    /* Start screen */
    #startScreen {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        background: linear-gradient(
            rgba(0,0,0,.45),
            rgba(0,0,0,.7)
        );
        color: white;
        text-align: center;
    }

    #startScreen h1 {
        font-size: 42px;
        margin-bottom: 8px;
        text-shadow: 0 3px 8px black;
    }

    #startScreen p {
        margin-bottom: 25px;
        opacity: .9;
    }

    #startButton {
        border: none;
        padding: 15px 35px;
        border-radius: 30px;
        font-size: 18px;
        font-weight: bold;
        color: white;
        background: #e53935;
        box-shadow: 0 5px 15px rgba(0,0,0,.35);
    }

    #message {
        position: fixed;
        left: 50%;
        top: 18%;
        transform: translateX(-50%);
        color: white;
        font-size: 25px;
        font-weight: bold;
        text-shadow: 0 2px 5px black;
        z-index: 40;
        pointer-events: none;
    }
</style>
</head>

<body>

<div id="game"></div>

<div id="startScreen">
    <h1>⚡ BATTLE ZONE</h1>
    <p>Stage 1 • 3D Survival Prototype</p>
    <button id="startButton">START GAME</button>
</div>

<div id="crosshair"></div>

<div id="topUI">
    <div class="panel">
        ❤️ HP
        <div id="healthBar">
            <div id="health"></div>
        </div>
    </div>

    <div class="panel">
        👤 Players: <span id="players">1</span>
    </div>
</div>

<div id="message"></div>

<div id="joystick">
    <div id="stick"></div>
</div>

<div id="jump" class="action">JUMP</div>
<div id="run" class="action">RUN</div>
<div id="shoot" class="action">FIRE</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene;
let camera;
let renderer;

let player;
let playerBody;
let playerHead;

let keys = {};

let joystickActive = false;
let joystickX = 0;
let joystickY = 0;

let running = false;
let gameStarted = false;

let velocityY = 0;
let onGround = true;

let clock = new THREE.Clock();

const WORLD_SIZE = 300;

/* -----------------------------
   INITIALIZE
----------------------------- */

function init() {

    scene = new THREE.Scene();

    scene.background = new THREE.Color(0x87ceeb);

    scene.fog = new THREE.Fog(
        0x87ceeb,
        80,
        300
    );

    camera = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );

    renderer = new THREE.WebGLRenderer({
        antialias: true
    });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    document
        .getElementById("game")
        .appendChild(renderer.domElement);

    createLights();
    createWorld();
    createPlayer();

    window.addEventListener(
        "resize",
        resize
    );

    setupKeyboard();
    setupJoystick();
    setupButtons();

    animate();
}

/* -----------------------------
   LIGHTING
----------------------------- */

function createLights() {

    const hemi = new THREE.HemisphereLight(
        0xffffff,
        0x557755,
        2
    );

    scene.add(hemi);

    const sun = new THREE.DirectionalLight(
        0xffffff,
        2
    );

    sun.position.set(
        80,
        120,
        50
    );

    sun.castShadow = true;

    scene.add(sun);
}

/* -----------------------------
   WORLD
----------------------------- */

function createWorld() {

    /* Ground */

    const groundGeometry =
        new THREE.PlaneGeometry(
            WORLD_SIZE,
            WORLD_SIZE,
            20,
            20
        );

    const groundMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x4f8f45
        });

    const ground =
        new THREE.Mesh(
            groundGeometry,
            groundMaterial
        );

    ground.rotation.x = -Math.PI / 2;

    scene.add(ground);


    /* Water */

    const waterGeometry =
        new THREE.PlaneGeometry(
            WORLD_SIZE + 80,
            WORLD_SIZE + 80
        );

    const waterMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x2b9fd6,
            transparent: true,
            opacity: .65
        });

    const water =
        new THREE.Mesh(
            waterGeometry,
            waterMaterial
        );

    water.rotation.x = -Math.PI / 2;
    water.position.y = -0.5;

    scene.add(water);


    /* Buildings */

    for (let i = 0; i < 22; i++) {

        const x =
            (Math.random() - .5) * 240;

        const z =
            (Math.random() - .5) * 240;

        createBuilding(x, z);
    }


    /* Trees */

    for (let i = 0; i < 65; i++) {

        const x =
            (Math.random() - .5) * 270;

        const z =
            (Math.random() - .5) * 270;

        createTree(x, z);
    }


    /* Rocks */

    for (let i = 0; i < 35; i++) {

        const x =
            (Math.random() - .5) * 260;

        const z =
            (Math.random() - .5) * 260;

        createRock(x, z);
    }
}

/* -----------------------------
   BUILDING
----------------------------- */

function createBuilding(x, z) {

    const width =
        8 + Math.random() * 8;

    const height =
        5 + Math.random() * 8;

    const depth =
        8 + Math.random() * 8;

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: 0xb9b09b
        });

    const building =
        new THREE.Mesh(
            geometry,
            material
        );

    building.position.set(
        x,
        height / 2,
        z
    );

    scene.add(building);


    /* Roof */

    const roofGeometry =
        new THREE.BoxGeometry(
            width + .5,
            .7,
            depth + .5
        );

    const roofMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x5a3d32
        });

    const roof =
        new THREE.Mesh(
            roofGeometry,
            roofMaterial
        );

    roof.position.set(
        x,
        height + .35,
        z
    );

    scene.add(roof);
}

/* -----------------------------
   TREE
----------------------------- */

function createTree(x, z) {

    const trunkGeometry =
        new THREE.CylinderGeometry(
            .45,
            .65,
            4,
            8
        );

    const trunkMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x70452b
        });

    const trunk =
        new THREE.Mesh(
            trunkGeometry,
            trunkMaterial
        );

    trunk.position.set(
        x,
        2,
        z
    );

    scene.add(trunk);


    const leavesGeometry =
        new THREE.SphereGeometry(
            2.5,
            10,
            8
        );

    const leavesMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x237a32
        });

    const leaves =
        new THREE.Mesh(
            leavesGeometry,
            leavesMaterial
        );

    leaves.position.set(
        x,
        5,
        z
    );

    scene.add(leaves);
}

/* -----------------------------
   ROCK
----------------------------- */

function createRock(x, z) {

    const size =
        .7 + Math.random() * 1.8;

    const geometry =
        new THREE.DodecahedronGeometry(size);

    const material =
        new THREE.MeshStandardMaterial({
            color: 0x777777
        });

    const rock =
        new THREE.Mesh(
            geometry,
            material
        );

    rock.position.set(
        x,
        size * .5,
        z
    );

    rock.rotation.y =
        Math.random() * Math.PI;

    scene.add(rock);
}

/* -----------------------------
   PLAYER
----------------------------- */

function createPlayer() {

    player = new THREE.Group();

    /* Body */

    const bodyGeometry =
        new THREE.BoxGeometry(
            1.2,
            1.7,
            .7
        );

    const bodyMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x263238
        });

    playerBody =
        new THREE.Mesh(
            bodyGeometry,
            bodyMaterial
        );

    playerBody.position.y = 1.35;

    player.add(playerBody);


    /* Head */

    const headGeometry =
        new THREE.SphereGeometry(
            .45,
            16,
            12
        );

    const headMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xc98b62
        });

    playerHead =
        new THREE.Mesh(
            headGeometry,
            headMaterial
        );

    playerHead.position.y = 2.45;

    player.add(playerHead);


    /* Legs */

    const legGeometry =
        new THREE.BoxGeometry(
            .38,
            1.3,
            .4
        );

    const legMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x182027
        });

    const leftLeg =
        new THREE.Mesh(
            legGeometry,
            legMaterial
        );

    leftLeg.position.set(
        -.3,
        .65,
        0
    );

    player.add(leftLeg);


    const rightLeg =
        new THREE.Mesh(
            legGeometry,
            legMaterial
        );

    rightLeg.position.set(
        .3,
        .65,
        0
    );

    player.add(rightLeg);


    player.position.set(
        0,
        0,
        20
    );

    scene.add(player);

    camera.position.set(
        0,
        5,
        28
    );

    camera.lookAt(
        player.position.x,
        1.5,
        player.position.z
    );
}

/* -----------------------------
   KEYBOARD
----------------------------- */

function setupKeyboard() {

    window.addEventListener(
        "keydown",
        e => {

            keys[e.key.toLowerCase()] = true;

            if (e.key === " ") {
                jump();
            }
        }
    );

    window.addEventListener(
        "keyup",
        e => {
            keys[e.key.toLowerCase()] = false;
        }
    );
}

/* -----------------------------
   JOYSTICK
----------------------------- */

function setupJoystick() {

    const joystick =
        document.getElementById("joystick");

    const stick =
        document.getElementById("stick");


    function moveStick(clientX, clientY) {

        const rect =
            joystick.getBoundingClientRect();

        const centerX =
            rect.left + rect.width / 2;

        const centerY =
            rect.top + rect.height / 2;

        let dx =
            clientX - centerX;

        let dy =
            clientY - centerY;

        const max =
            rect.width / 2 - 30;

        const distance =
            Math.sqrt(dx * dx + dy * dy);

        if (distance > max) {

            dx =
                dx / distance * max;

            dy =
                dy / distance * max;
        }

        stick.style.transform =
            `translate(calc(-50% + ${dx}px),
                       calc(-50% + ${dy}px))`;

        joystickX = dx / max;
        joystickY = dy / max;
    }


    joystick.addEventListener(
        "touchstart",
        e => {

            joystickActive = true;

            const t =
                e.touches[0];

            moveStick(
                t.clientX,
                t.clientY
            );
        }
    );


    joystick.addEventListener(
        "touchmove",
        e => {

            if (!joystickActive) return;

            const t =
                e.touches[0];

            moveStick(
                t.clientX,
                t.clientY
            );
        }
    );


    joystick.addEventListener(
        "touchend",
        () => {

            joystickActive = false;

            joystickX = 0;
            joystickY = 0;

            stick.style.transform =
                "translate(-50%, -50%)";
        }
    );
}

/* -----------------------------
   BUTTONS
----------------------------- */

function setupButtons() {

    document
        .getElementById("startButton")
        .addEventListener(
            "click",
            startGame
        );


    document
        .getElementById("jump")
        .addEventListener(
            "touchstart",
            jump
        );


    document
        .getElementById("run")
        .addEventListener(
            "touchstart",
            () => {
                running = true;
            }
        );


    document
        .getElementById("run")
        .addEventListener(
            "touchend",
            () => {
                running = false;
            }
        );


    document
        .getElementById("shoot")
        .addEventListener(
            "touchstart",
            shoot
        );
}

/* -----------------------------
   START
----------------------------- */

function startGame() {

    gameStarted = true;

    document
        .getElementById("startScreen")
        .style.display = "none";

    showMessage(
        "Explore the island!"
    );
}

/* -----------------------------
   JUMP
----------------------------- */

function jump() {

    if (!gameStarted) return;

    if (onGround) {

        velocityY = 9;

        onGround = false;
    }
}

/* -----------------------------
   SHOOT
----------------------------- */

function shoot() {

    if (!gameStarted) return;

    showMessage("🔫 FIRE!");

    setTimeout(() => {
        document.getElementById("message").textContent = "";
    }, 500);
}

/* -----------------------------
   PLAYER MOVEMENT
----------------------------- */

function updatePlayer(delta) {

    if (!gameStarted) return;

    let moveX = 0;
    let moveZ = 0;


    /* Keyboard */

    if (keys["w"]) moveZ -= 1;
    if (keys["s"]) moveZ += 1;
    if (keys["a"]) moveX -= 1;
    if (keys["d"]) moveX += 1;


    /* Mobile joystick */

    moveX += joystickX;
    moveZ += joystickY;


    const length =
        Math.sqrt(
            moveX * moveX +
            moveZ * moveZ
        );

    if (length > 1) {

        moveX /= length;
        moveZ /= length;
    }


    let speed =
        running ? 10 : 5;


    player.position.x +=
        moveX * speed * delta;

    player.position.z +=
        moveZ * speed * delta;


    /* Gravity */

    velocityY -=
        22 * delta;

    player.position.y +=
        velocityY * delta;


    if (player.position.y <= 0) {

        player.position.y = 0;

        velocityY = 0;

        onGround = true;
    }


    /* World boundary */

    const limit =
        WORLD_SIZE / 2 - 5;

    player.position.x =
        Math.max(
            -limit,
            Math.min(
                limit,
                player.position.x
            )
        );

    player.position.z =
        Math.max(
            -limit,
            Math.min(
                limit,
                player.position.z
            )
        );


    /* Rotate player */

    if (Math.abs(moveX) > .05 ||
        Math.abs(moveZ) > .05) {

        player.rotation.y =
            Math.atan2(
                moveX,
                moveZ
            );
    }
}

/* -----------------------------
   CAMERA
----------------------------- */

function updateCamera(delta) {

    const target =
        new THREE.Vector3(
            player.position.x,
            player.position.y + 1.6,
            player.position.z
        );


    const cameraOffset =
        new THREE.Vector3(
            0,
            5,
            9
        );


    cameraOffset.applyAxisAngle(
        new THREE.Vector3(0, 1, 0),
        player.rotation.y
    );


    const desired =
        target.clone().add(
            cameraOffset
        );


    camera.position.lerp(
        desired,
        Math.min(
            1,
            delta * 7
        )
    );


    camera.lookAt(target);
}

/* -----------------------------
   MESSAGE
----------------------------- */

function showMessage(text) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    setTimeout(() => {

        message.textContent = "";

    }, 1600);
}

/* -----------------------------
   RESIZE
----------------------------- */

function resize() {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}

/* -----------------------------
   GAME LOOP
----------------------------- */

function animate() {

    requestAnimationFrame(
        animate
    );
